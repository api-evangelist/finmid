                  - description: Legal address of the buyer.
                    required:
                    - address_line_1
                    - postal_code
                    - city
                    - country
                    example:
                      address_line_1: Musterstraße 1
                      postal_code: '11225'
                      city: Musterstadt
                      state: Saarland
                      country: DEU
        required: true
      responses:
        '200':
          description: The buyer was created successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                - legal_name
                - legal_address
                properties:
                  id:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
                    - description: ID of the buyer.
                      example: buyer-123
                  status:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1list/get/parameters/0/schema/items'
                    - description: Current status of the buyer.
                      example: PENDING
                  legal_name:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/legal_name/allOf/0'
                    - description: Legal name of the buyer's business.
                      example: Tante Emma GmbH
                  business_registration_number:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/business_registration_number/allOf/0'
                    - description: Business registration number of the buyer.
                      example: HRB123456B
                  tax_number:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/tax_number/allOf/0'
                    - description: 'Identification number assigned to the buyer by local tax office.

                        '
                      example: 12/345/67890
                  email:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/email/allOf/0'
                    - description: Email address of the buyer.
                      example: emma@example.com
                  phone:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/phone/allOf/0'
                    - description: Phone number of the buyer in the international format (e.g. `+49123456789`).
                      example: '+49123456789'
                  legal_address:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/legal_address/allOf/0'
                    - description: Legal address of the buyer.
                      required:
                      - address_line_1
                      - postal_code
                      - city
                      - country
                      example:
                        address_line_1: Musterstraße 1
                        postal_code: '11225'
                        city: Musterstadt
                        state: Saarland
                        country: DEU
        '400':
          description: The request is invalid and failed validation.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - code
                  - description
                  properties:
                    code:
                      allOf:
                      - type: string
                        enum:
                        - validation_error
                        - server_error
                        - buyer_invalid
                        - seller_invalid
                        - platform_invalid
                        - payment_request_invalid
                        - line_item_invalid
                        - buyer_conflict
                        - seller_conflict
                        - payment_request_conflict
                        - business_conflict
                        - business_not_found
                        - document_already_exists
                        - incoming_webhook_conflict
                        - mcc_not_eligible
                        - offer_group_not_active
                        - offer_group_not_found
                        - platform_check_already_consumed
                        - platform_check_not_required
                        - platform_check_unavailable
                        - platform_checks_not_enabled
                      - description: Code that represents the kind of error.
                    description:
                      allOf:
                      - type: string
                      - description: A more detailed description of the error.
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - validation_error
                    description:
                      example: legal_name must not be blank
        '401':
          description: Missing or invalid API key. Could not authenticate API request.
        '409':
          description: Buyer exists already.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/400/content/application~1json/schema/allOf/0'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - buyer_conflict
                    description:
                      example: Cannot create this buyer because it exists already
        '500':
          description: An unexpected server error occurred. You should try again later or contact finmid support.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/400/content/application~1json/schema/allOf/0'
                - properties:
                    code:
                      type: string
                      enum:
                      - server_error
                    description:
                      example: Our server was hit by a meteorite 💥.
              examples:
                server_error:
                  value:
                    code: server_error
                    description: Internal processing error
  /api/v2/b2b-payments/buyers/list:
    get:
      tags:
      - Buyer
      operationId: get-buyers-for-platform
      summary: Get Buyers
      description: Returns a list of buyers. Cursor-based pagination is supported and you can make use of filter parameters to change sorting or limit the results to only buyers with certain status..
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: array
          description: 'List of buyer status. Providing one or more status only includes buyers that have one of the provided status.

            '
          items:
            type: string
            enum:
            - PENDING
            - ACTIVE
            - INACTIVE
            - REJECTED
            - SUSPENDED
      - name: sort_by
        in: query
        required: false
        schema:
          description: Sorting of the results.
          type: string
          enum:
          - CREATED_ASC
          - CREATED_DESC
      - name: cursor
        in: query
        required: false
        schema:
          description: A cursor used for pagination.
          example: cGktMTIzNDV8MjAyMi0wNC0yOFQwNjowOToxNyswMDowMAo=
          type: string
      - name: limit
        in: query
        required: false
        schema:
          description: Limits the amount of results per page.
          example: 20
          type: integer
          format: int32
          default: 100
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: A result set containing details of buyers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      next_cursor:
                        type: string
                        description: A cursor pointing to the beginning of the next page.
                        example: ddTkVYVHxmMzA1ZjBlNi00YzM2LTQwZmEtOTI5YS0yZjJiODJlYjU2ZjR8MjAyMi0xMC0yOFQxMDoxMDoyOS4zMTkzMDlafA
                      previous_cursor:
                        type: string
                        description: A cursor pointing to the beginning of the previous page.
                        example: ccUFJFVklPVVN8ZjhjODRmYzctZDIyMS00NzYxLThlMTktN2QxYTM5ZTIyZDgxfDIwMjItMTEtMDJUMTM6NTE6MTkuMzI3MTk1Wnw
                  data:
                    description: List of Buyers.
                    type: array
                    items:
                      $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/200/content/application~1json/schema'
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
  /api/v2/b2b-payments/buyers/{id}:
    get:
      tags:
      - Buyer
      operationId: get-buyer-v2
      summary: Get Buyer
      description: For getting a certain buyer's details, you'll only need the buyer's ID specified on creation.
      parameters:
      - name: id
        description: ID of the buyer as specified on buyer creation.
        in: path
        required: true
        schema:
          $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
      responses:
        '200':
          description: Details of the requested buyer.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/200/content/application~1json/schema'
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '404':
          description: No buyer found for the given ID.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/400/content/application~1json/schema/allOf/0'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - buyer_invalid
                    description:
                      example: Buyer with ID buyer-000 does not exist
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
    patch:
      tags:
      - Buyer
      x-tags:
      - PatchBuyer
      operationId: update-buyer-v2
      summary: Update Buyer
      description: 'Update a buyer if certain data changes on your platform. For this you''ll need:

        1. The buyer''s ID specified on creation

        2. The data you want to change

        '
      parameters:
      - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1{id}/get/parameters/0'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                legal_name:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/legal_name/allOf/0'
                  - description: New legal name of the business.
                    example: Onkel Ernie GmbH
                email:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/email/allOf/0'
                  - description: New email address of the buyer.
                    example: ernie@example.com
                phone:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/phone/allOf/0'
                  - description: New phone number of the buyer.
                    example: '+49987654321'
                legal_address:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/legal_address/allOf/0'
                  - description: New legal address of the buyer.
                    example:
                      address_line_1: Mustergasse 1
                      postal_code: '12345'
                      city: Musterstadt
                      state: Niedersachsen
                      country: DEU
        required: true
      responses:
        '200':
          description: Updated buyer details.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/200/content/application~1json/schema'
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '404':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1{id}/get/responses/404'
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
  /api/v2/b2b-payments/buyers/{id}/payment-limit:
    get:
      tags:
      - Buyer
      operationId: get-buyer-limit-v2
      summary: Get Buyer Limit
      description: 'Get estimated buyer limit in a target currency.

        > 📘

        >

        > Note: this limit is an estimate and subject to change depending on a specific payment request parameters. To verify if specific purchase can be financed please use [Check Payment Request API](../reference/check-payment-request-v2)

        '
      parameters:
      - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1{id}/get/parameters/0'
      - name: currency
        in: query
        required: false
        schema:
          allOf:
          - description: Three-letter currency code (ISO 4217). Supported currencies `EUR`, `GBP`, and `USD`.
            type: string
            example: EUR
      responses:
        '200':
          description: Estimated limit for the buyer.
          content:
            application/json:
              schema:
                type: object
                required:
                - estimated_remaining_limit
                - currency
                - total_limit
                - used_limit
                - pending_requests_amount
                properties:
                  estimated_remaining_limit:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                    - description: Estimated available amount which could be approved for payment request for the buyer.
                      example: 9000
                  total_limit:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                    - description: Estimated maximum amount of all open buyer's payment requests.
                      example: 10000
                  used_limit:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                    - description: Sum of all pending and reserved buyer's payment requests.
                      example: 1000
                  pending_requests_amount:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                    - description: Sum of all reserved but not pending for repayment buyer's payment requests.
                      example: 500
                  currency:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1{id}~1payment-limit/get/parameters/1/schema/allOf/0'
                    - description: Three-letter currency code (ISO 4217). Supported currencies `EUR` and `GBP`
                      example: EUR
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '404':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1{id}/get/responses/404'
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
  /api/v2/b2b-payments/payment-requests:
    post:
      tags:
      - Payment Request
      operationId: create-payment-request-v2
      summary: Create Payment Request
      description: 'The create payment request resource endpoint creates a loan and reserves the specified order amount. This process is called authorisations. When you authorise, finmid will generate a unique id that you''ll use to reference the transaction moving forward.


        For creating a new payment request, you need the following things:

        1. Create a new ID for this payment request (we recommend using the invoice number),

        2. Choose repayment term days,

        3. Buyer''s ID specified on creation,

        4. Seller ID

        5. Total order amount.

        7. (Optional) Invoice due date, which can be added now, or via the update endpoint.


        > ⚠️ Invoice Number

        >

        > Invoice number is optional upon payment request creation.  However, it must be provided prior to capturing the payment request. Invoice number can be provided via the [Update Payment Request](../reference/update-payment-request-v2) endpoint

        '
      requestBody:
        content:
          application/json:
            schema:
              required:
              - repayment_term_days
              - buyer_id
              - currency
              - id
              - total_amount
              - seller_id
              type: object
              properties:
                id:
                  $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
                repayment_term_days:
                  description: Repayment period term in days.
                  type: integer
                  minimum: 0
                  example: 30
                buyer_id:
                  $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
                seller_id:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
                  - description: seller of the payment request
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                currency:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1{id}~1payment-limit/get/parameters/1/schema/allOf/0'
                  - description: Three-letter currency code (ISO 4217).
                total_amount:
                  allOf:
                  - description: The amount with up to 2 decimal places.
                    type: number
                    pattern: ^(?:\+|-)?[0-9]+(?:\.[0-9]+)$
                    example: 1000
                  - description: The total amount of the order with up to 2 decimal places.
                    example: 1000
                invoice_number:
                  description: Invoice ID corresponding to the transactions in the payment request.
                  type: string
                  maxLength: 100
                invoice_due_date:
                  type: string
                  format: date
                  example: '2023-08-01'
                total_fee_override:
                  $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/responses/200/content/application~1json/schema/properties/financing_portion/allOf/0/properties/portion/allOf/0'
                  description: The percentage value expressed relative to the total intent amount, which overrides the default total fee deducted upon payout(s).
                payout_maximum_now:
                  type: boolean
                  description: If set to true, the payment request will be paid-out immediately after creation.
        required: true
      responses:
        '200':
          description: The created payment request.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                - creation_time
                - buyer_id
                - total_amount
                - financing_portion
                - amount_details
                - amounts_breakdown
                - currency
                - repayment_term_days
                - repayment_date
                properties:
                  id:
                    description: ID of the payment request.
                    type: string
                  status:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1list/get/parameters/2/schema/items'
                    - description: Current status of the payment request.
                  creation_time:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1reports~1settlement/get/responses/200/content/application~1json/schema/properties/created_at/allOf/0'
                    - description: Creation time of the payment request (ISO 8601 datetime).
                  buyer_id:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
                    - description: ID of the buyer associated with the payment request.
                  order_id:
                    type: string
                    description: 'The ID of the order associated with the payment request. Use this ID to perform read/update actions on the order.

                      '
                  total_amount:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                    - description: Total amount of the transaction.
                      example: 1000
                  financing_portion:
                    allOf:
                    - type: object
                      required:
                      - portion
                      - amount
                      properties:
                        portion:
                          allOf:
                          - type: number
                            description: Percentage expressed in decimal form (between 0 and 1).
                            pattern: ^(?:\+|-)?[0-9]+(?:\.[0-9]+)$
                            example: 0.5
                          - description: Percentage of total payment request amount that can be financed/paid out.
                        amount:
                          allOf:
                          - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                          - description: Total amount that can be paid out.
                            example: 1000
                    - description: Represents the financing condition for the payment request, in terms of how much can be paid out.
                  amount_details:
                    deprecated: true
                    type: object
                    required:
                    - original_amount
                    - platform_fee_amount
                    - buyer_fee_amount
                    - sellers_fee_amount
                    properties:
                      original_amount:
                        allOf:
                        - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                        - description: Original amount as requested.
                      platform_fee_amount:
                        allOf:
                        - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                        - description: Applying platform fees.
                      buyer_fee_amount:
                        allOf:
                        - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                        - description: Applying buyer fees.
                      sellers_fee_amount:
                        type: object
                        description: 'Map of fees applied per seller. Key is seller id, value is amount of the fee in payment request currency

                          '
                        additionalProperties:
                          allOf:
                          - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                          - description: Applying sellers fees.
                  amounts_breakdown:
                    type: object
                    required:
                    - total_amount
                    - fees
                    - payout_amount
                    properties:
                      total_amount:
                        allOf:
                        - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                        - description: Total amount as requested.
                      fees:
                        type: object
                        required:
                        - total_fee_amount
                        - details
                        properties:
                          total_fee_amount:
                            allOf:
                            - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                            - description: Total fee being charged on the payment request. Deducted upon payout(s).
                          details:
                            type: object
                            required:
                            - service_fee_amount
                            - platform_markup_amount
                            properties:
                              service_fee_amount:
                                allOf:
                                - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                                - description: Fee being charged to platform by finmid. Deducted from total_fee_amount, and calculated against net payout amount.
                              platform_markup_amount:
                                allOf:
                                - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                                - description: Markup platform receives via settlement. Difference between total_fee and service_fee.
                      payout_amount:
                        allOf:
                        - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                        - description: Total amount deducted of total fee.
                  currency:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1{id}~1payment-limit/get/parameters/1/schema/allOf/0'
                    - description: Three-letter currency code (ISO 4217).
                  repayment_term_days:
                    $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/repayment_term_days'
                  repayment_type:
                    deprecated: true
                    description: Repayment type to use in responses.
                    type: string
                    enum:
                    - SCT
                    - SDD
                    example: SCT
                  repayment_date:
                    type: string
                    format: date
                    example: '2023-08-01'
                  metadata:
                    description: 'Set of **key-value pairs** that are attached to the payment request. Used for sharing extra data.

                      '
                    type: object
                  invoice_number:
                    description: Invoice ID corresponding to the transactions in the payment request.
                    $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/invoice_number'
                  invoice_due_date:
                    type: string
                    format: date
                    example: '2023-08-01'
                  payouts:
                    description: A result set containing payouts for the given payment request.
                    type: array
                    items:
                      $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1payouts/post/responses/200/content/application~1json/schema'
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
  /api/v2/b2b-payments/payment-requests/documents:
    post:
      tags:
      - Tasks
      operationId: upload-payment-request-documents
      summary: Upload payment documents
      description: 'Upload a list of documents for a task with entity type: `PAYMENT_REQUEST_TASK`  the documents will then be used for the approval of payment request payouts during the spot checks process.  Some documents that can be provided are:

        - Invoice - Order confirmation or sales contract - Shipping document or bill of lading - Other documents supporting your payment request

        Your documents must be in JPG, PNG, or PDF and no larger than 15.0 MB

        '
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
          description: Id of the payment request for which to submit documents to.
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '202':
          description: We have accepted the submitted documents.
  /api/v2/b2b-payments/payment-requests/list:
    get:
      tags:
      - Payment Request
      operationId: get-payment-requests-v2
      summary: Get Payment Requests
      description: 'Returns a list of payment requests. Cursor-based pagination is supported and you can make use of filter parameters to change sorting or limit the results to only payment requests with certain status.

        '
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Creation date of the first payment request to be included in the results.
          example: '2022-01-01'
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Creation date of the last payment request to be included in the results.
          example: '2022-01-31'
      - name: status
        in: query
        required: false
        schema:
          type: array
          description: 'List of payment request status. Providing one or more status only includes payment requests that have one of the provided status.

            '
          items:
            type: string
            enum:
            - PENDING
            - PROCESSING
            - PENDING_REPAYMENT
            - CANCELLED
            - CLOSED
            - DEFAULT
      - name: sort_by
        in: query
        required: false
        schema:
          description: Sorting of the results.
          type: string
          enum:
          - CREATED_ASC
          - CREATED_DESC
      - name: cursor
        in: query
        required: false
        schema:
          description: A cursor used for pagination.
          example: cGktMTIzNDV8MjAyMi0wNC0yOFQwNjowOToxNyswMDowMAo=
          type: string
      - name: limit
        in: query
        required: false
        schema:
          description: Limits the amount of results per page.
          example: 20
          type: integer
          format: int32
          default: 100
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: A result set containing payment requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      next_cursor:
                        type: string
                        description: A cursor pointing to the beginning of the next page.
                        example: TkVYVHxmMzA1ZjBlNi00YzM2LTQwZmEtOTI5YS0yZjJiODJlYjU2ZjR8MjAyMi0xMC0yOFQxMDoxMDoyOS4zMTkzMDlafA
                      previous_cursor:
                        type: string
                        description: A cursor pointing to the beginning of the previous page.
                        example: UFJFVklPVVN8ZjhjODRmYzctZDIyMS00NzYxLThlMTktN2QxYTM5ZTIyZDgxfDIwMjItMTEtMDJUMTM6NTE6MTkuMzI3MTk1Wnw
                  data:
                    description: List of payment requests.
                    type: array
                    items:
                      $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/responses/200/content/application~1json/schema'
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
  /api/v2/b2b-payments/payment-requests/{id}:
    get:
      tags:
      - Payment Request
      operationId: get-payment-request-v2
      summary: Get Payment Request
      description: For getting a certain payment request's details, you'll only need the payment request's ID specified on creation.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The payment request.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/responses/200/content/application~1json/schema'
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
  /api/v2/b2b-payments/payment-requests/{id}/cancel:
    put:
      tags:
      - Payment Request
      operationId: cancel-payment-request-v2
      summary: Cancel Payment Request
      description: 'Cancels an existing payment request and releases the loan amount reserved for the payment. For this you''ll only need the payment request ID specified on creation.

        > 📘

        >

        > This operation is only permitted if the seller has captured no items in the order. Please note that cancelling a payment request is not reversible.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          allOf:
          - type: string
            pattern: ^[a-zA-Z0-9_\.\-]{1,100}$
            maxLength: 100
          - description: ID of the payment request.
            example: pi-12345
      responses:
        '200':
          description: The payment request is canceled.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/responses/200/content/application~1json/schema'
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
  /api/v2/b2b-payments/payment-requests/{id}/payouts:
    post:
      tags:
      - Payment Request
      operationId: create-payment-request-payout
      summary: Create Payout
      description: "The payout payment request endpoint triggers a payment to the seller associated with the loan  initially reserved during the creation of the payment request.  As soon as a payout is created, the payment is processed immediately through finmid.\nAfter a payout is created, the payment request status will change to PROCESSING if the payment request amount  is only partially paid. Once the max payout amount is fully paid out,  the status will then change to PENDING_REPAYMENT.\nTo create a payout for a certain payment request, you'll need four things:\n1. The payment request ID specified during creation.\n2. The Payout ID, a unique identifier within the payment request of your choice for this payout.\n3. The payout type, which can be PERCENTAGE, AMOUNT, or MAX.\n4. The payout value, which is related to the payout type and is only required for percentage and amount types. \nFor instance, if the payout type is percentage and the value is 50, then 50% of the payment request will\
        \ be paid out.\nThe payout response body includes:\n\n  - Gross amount: This is the total amount of the payout relative to the payment request including fees.\n\n  - Net amount: This is the amount the seller actually receives, calculated as the gross amount minus fees.\n\n  - Status: This reflects the state of the seller's payment, with three possible statuses: `PENDING`, `PAID_OUT`, and `REJECTED`.\n"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Id of the payment request for which to create a payout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - required:
                - id
                - value
                - payout_type
                properties:
                  id:
                    $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
                    description: Id given to the payout, must be unique within a payment request.
                  payout_type:
                    type: string
                    enum:
                    - AMOUNT
                  value:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
              - required:
                - id
                - payout_type
                - value
                properties:
                  id:
                    $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
                    description: Id given to the payout, must be unique within a payment request.
                  payout_type:
                    type: string
                    enum:
                    - PERCENTAGE
                  value:
                    $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/responses/200/content/application~1json/schema/properties/financing_portion/allOf/0/properties/portion/allOf/0'
                    description: The percentage to payout (between 0 and 1), as expressed relative to the total payment request amount.
              - required:
                - id
                - payout_type
                properties:
                  id:
                    $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
                    description: Id given to the payout, must be unique within a payment request.
                  payout_type:
                    type: string
                    enum:
                    - MAX
      responses:
        '200':
          description: The payout request has been successfully created.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                - seller_id
                - gross_amount
                - net_amount
                - currency
                - creation_time
                properties:
                  id:
                    description: ID of the payment request.
                    type: string
                  status:
                    type: string
                    enum:
                    - PENDING
                    - PAID_OUT
                    - REJECTED
                    description: Current status of the payout.
                  seller_id:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
                    - description: ID of the seller.
                      example: seller-321
                  gross_amount:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                    - description: Gross amount of the payout.
                      example: 1000
                  net_amount:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                    - description: Net amount of the payout (Gross minus any fees charged on the payout).
                      example: 990
                  currency:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1{id}~1payment-limit/get/parameters/1/schema/allOf/0'
                    - description: Three-letter currency code (ISO 4217).
                  creation_time:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1reports~1settlement/get/responses/200/content/application~1json/schema/properties/created_at/allOf/0'
                    - description: Creation time of the payout (ISO 8601 datetime).
                  booking_time:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1reports~1settlement/get/responses/200/content/application~1json/schema/properties/created_at/allOf/0'
                    - description: Booking time of the payout (ISO 8601 datetime).
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
  /api/v2/b2b-payments/payment-requests/{id}/update:
    patch:
      tags:
      - Payment Request
      operationId: update-payment-request-v2
      summary: Update Payment Request
      description: 'Allows for the updating of invoice number and invoice due date fields.  Invoice number must be provided to execute a payout.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          allOf:
          - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
          - description: ID of the payment request.
            example: pi-12345
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                invoice_number:
                  description: Invoice ID corresponding to the transactions in the payment request.
                  $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/invoice_number'
                invoice_due_date:
                  type: string
                  format: date
                  example: '2023-08-01'
                total_amount:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                  - description: The new total amount of the Payment Request with up to 2 decimal places.
                    example: 1000
        required: true
      responses:
        '200':
          description: The payment request is updated.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/responses/200/content/application~1json/schema'
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
  /api/v2/b2b-payments/reports/settlement:
    get:
      tags:
      - Beta Endpoints
      operationId: get-settlement-report
      summary: Seller Settlements Report
      description: 'Returns a list of payouts made to sellers within a given date range. A payout corresponds to actual money being  transferred to the seller’s account as a consequence of a Payment Request (Line Item) being captured.

        '
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Payout date of the first payout to be included in the results.
          example: '2023-01-01'
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Payout date of the last payout.
          example: '2023-01-31'
      responses:
        '200':
          description: Returns metadata regarding report creation, and a list of payouts to sellers.
          content:
            application/json:
              schema:
                required:
                - created_at
                - data
                - from_date
                - to_date
                type: object
                properties:
                  created_at:
                    allOf:
                    - type: string
                      format: date-time
                      pattern: ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d{1,9})?(?:Z|[+-][01]\d:[0-5]\d)$
                    - description: Timestamp at which the report was generated.
                  from_date:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1reports~1settlement/get/responses/200/content/application~1json/schema/properties/to_date/allOf/0'
                  to_date:
                    allOf:
                    - type: string
                      format: date
                      pattern: ^[0-9]{4}-[0-9][2]-[0-9][2]$
                  data:
                    type: array
                    description: List of individual payouts made to sellers within the given date range.
                    items:
                      required:
                      - capture_date
                      - currency
                      - line_item_id
                      - original_amount
                      - payment_request_id
                      - payment_reference
                      - payout_amount
                      - payout_date
                      - seller_fee_amount
                      - seller_id
                      - total_paid_amount
                      - remainder_amount
                      type: object
                      properties:
                        capture_date:
                          allOf:
                          - $ref: '#/paths/~1api~1v2~1b2b-payments~1reports~1settlement/get/responses/200/content/application~1json/schema/properties/to_date/allOf/0'
                          - description: Date the line item was captured by the platform.
                        payout_date:
                          allOf:
                          - $ref: '#/paths/~1api~1v2~1b2b-payments~1reports~1settlement/get/responses/200/content/application~1json/schema/properties/to_date/allOf/0'
                          - description: Date the captured amount was paid out to the seller.
                        payment_reference:
                          type: string
                          description: Payment reference included in the bank transaction to the seller.
                        payment_request_id:
                          type: string
                          description: ID of the payment request
                        seller_id:
                          type: string
                          description: ID of the seller associated with the payout.
                        line_item_id:
                          type: string
                        original_amount:
                          allOf:
                          - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                          - description: Total amount of the transaction.
                            example: 1000
                        seller_fee_amount:
                          allOf:
                          - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                          - description: Fee charged to seller.
                            example: 10
                        payout_amount:
                          allOf:
                          - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                          - description: Net amount (original_amount - fee) paid out to seller.
                            example: 990
                        currency:
                          allOf:
                          - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1{id}~1payment-limit/get/parameters/1/schema/allOf/0'
                          - description: Three-letter currency code (ISO 4217).
                        total_paid_amount:
                          allOf:
                          - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                          - description: Amount already paid out to seller.
                            example: 10
                        remainder_amount:
                          allOf:
                          - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                          - description: Amount remaining to be paid out.
                            example: 10
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
  /api/v2/b2b-payments/sellers:
    post:
      tags:
      - Seller
      operationId: create-seller-v2
      summary: Create Seller
      description: 'Let''s create/onboard a new seller. For this you''ll need 2 things:

        1. Create a new ID for this seller (should map to your internal identifier)

        2. The seller''s legal information. ⚠️ Note that one of either business_registration_number or tax_number **must** be provided on creation.


        > 📘

        >

        > You should create a seller entity for every seller on your platform that can be part of a lending transaction.

        '
      requestBody:
        content:
          application/json:
            schema:
              required:
              - id
              - legal_name
              - legal_address
              - bank_accounts
              - email
              type: object
              properties:
                id:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
                  - description: 'Custom ID of the seller, should map to your internal identifier. Must consist only of a-z, A-Z, 0-9 and .-_ characters, and length should not exceed 100 characters.

                      '
                    example: seller-321
                legal_name:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/legal_name/allOf/0'
                  - description: 'Business name of the seller (not necessarily the brand name). This should be the name as stated in official business registers.

                      '
                    example: Coolstore GmbH
                business_registration_number:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/business_registration_number/allOf/0'
                  - description: 'Registration number of the seller from the commercial register.

                      '
                    example: HRB654321B
                tax_number:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/tax_number/allOf/0'
                  - description: 'Identification number assigned to the seller by local tax office.

                      '
                    example: 12/345/67890
                email:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/email/allOf/0'
                  - description: Email address of the seller.
                    example: coolstore@example.com
                phone:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/phone/allOf/0'
                  - description: Phone number of the seller. Must be provided in the international format, e.g. `+49123456789`.
                    example: '+49123456789'
                legal_address:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/legal_address/allOf/0'
                  - description: Legal address of the seller.
                    required:
                    - address_line_1
                    - postal_code
                    - city
                    - country
                    example:
                      address_line_1: Mustergasse 123
                      postal_code: '55441'
                      city: Musterhausen
                      state: Niedersachsen
                      country: DEU
                bank_accounts:
                  type: array
                  description: 'Bank account details used for payouts to seller

                    Note: only one bank account allowed per currency.

                    '
                  items:
                    oneOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1sellers~1{id}~1bank-details/patch/requestBody/content/application~1json/schema/properties/bank_account/oneOf/0'
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1sellers~1{id}~1bank-details/patch/requestBody/content/application~1json/schema/properties/bank_account/oneOf/1'
                    - title: SWIFT Bank Account
                      type: object
                      required:
                      - account_number
                      - account_number_type
                      - bic_swift
                      - address
                      - currency
                      properties:
                        account_number:
                          description: IBAN or AccountNumber of the seller.
                          type: string
                        account_number_type:
                          description: Type of the accountNumber field. Either 'IBAN' or 'ACCOUNT_NUMBER'
                          type: string
                        bic_swift:
                          description: BIC of the seller's bank.
                          type: string
                        address:
                          type: object
                          required:
                          - address_line
                          - city
                          - country
                          properties:
                            address_line:
                              description: First line of the address. This is usually a street name and house number combination.
                              type: string
                              maxLength: 100
                            city:
                              description: City of the address.
                              type: string
                              maxLength: 100
                            country:
                              $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/legal_address/allOf/0/properties/country'
                        currency:
                          allOf:
                          - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1{id}~1payment-limit/get/parameters/1/schema/allOf/0'
        required: true
      responses:
        '200':
          description: The seller was created successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                - legal_name
                - bank_accounts
                properties:
                  id:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
                    - description: ID of the seller.
                      example: seller-321
                  status:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1sellers~1list/get/parameters/0/schema/items'
                    - description: Current status of the seller.
                      example: PENDING
                  legal_name:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/legal_name/allOf/0'
                    - description: Legal name of the seller's business.
                      example: Coolstore GmbH
                  business_registration_number:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/business_registration_number/allOf/0'
                    - description: Business registration number of the seller.
                      example: HRB654321B
                  tax_number:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/tax_number/allOf/0'
                    - description: 'Identification number assigned to the buyer by local tax office.

                        '
                      example: 12/345/67890
                  email:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/email/allOf/0'
                    - description: Email address of the seller.
                      example: coolstore@example.com
                  phone:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/phone/allOf/0'
                    - description: Phone number of the seller in the international format (e.g. `+49987654321`).
                      example: '+49987654321'
                  legal_address:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/legal_address/allOf/0'
                    - description: Legal address of the seller.
                      required:
                      - address_line_1
                      - postal_code
                      - city
                      - country
                      example:
                        address_line_1: Mustergasse 123
                        postal_code: '55441'
                        city: Musterhausen
                        state: Niedersachsen
                        country: DEU
                  bank_accounts:
                    type: array
                    description: Bank account details used for payouts to seller
                    items:
                      oneOf:
                      - $ref: '#/paths/~1api~1v2~1b2b-payments~1sellers~1{id}~1bank-details/patch/requestBody/content/application~1json/schema/properties/bank_account/oneOf/0'
                      - $ref: '#/paths/~1api~1v2~1b2b-payments~1sellers~1{id}~1bank-details/patch/requestBody/content/application~1json/schema/properties/bank_account/oneOf/1'
                      - $ref: '#/paths/~1api~1v2~1b2b-payments~1sellers/post/requestBody/content/application~1json/schema/properties/bank_accounts/items/oneOf/2'
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '409':
          description: Seller exists already.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/400/content/application~1json/schema/allOf/0'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - seller_conflict
                    description:
                      example: Cannot create this seller because it exists already
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
  /api/v2/b2b-payments/sellers/list:
    get:
      tags:
      - Seller
      operationId: get-sellers-for-platform
      summary: Get Sellers
      description: Returns a list of sellers. Cursor-based pagination is supported and you can make use of filter parameters to change sorting or limit the results to only sellers with certain status..
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: array
          description: 'List of sellers status. Providing one or more status only includes sellers that have one of the provided status.

            '
          items:
            type: string
            enum:
            - PENDING
            - ACTIVE
            - INACTIVE
            - REJECTED
            - SUSPENDED
      - name: sort_by
        in: query
        required: false
        schema:
          description: Sorting of the results.
          type: string
          enum:
          - CREATED_ASC
          - CREATED_DESC
      - name: cursor
        in: query
        required: false
        schema:
          description: A cursor used for pagination.
          example: cGktMTIzNDV8MjAyMi0wNC0yOFQwNjowOToxNyswMDowMAo=
          type: string
      - name: limit
        in: query
        required: false
        schema:
          description: Limits the amount of results per page.
          example: 20
          type: integer
          format: int32
          default: 100
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: A result set containing details of sellers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      next_cursor:
                        type: string
                        description: A cursor pointing to the beginning of the next page.
                        example: ddTkVYVHxwMzA1ZjBlNi00YzM2LTQwZmEtOTI5YS0yZjJiODJlYjU2ZjR8MjAyMi0xMC0yOFQxMDoxMDoyOS4zMTkzMDlafA
                      previous_cursor:
                        type: string
                        description: A cursor pointing to the beginning of the previous page.
                        example: ddUFJFVklPVVN8ZjhjODRmYzctZDIyMS00NzYxLThlMTktN2QxYTM5ZTIyZDgxfDIwMjItMTEtMDJUMTM6NTE6MTkuMzI3MTk1Wnw
                  data:
                    description: List of Sellers.
                    type: array
                    items:
                      $ref: '#/paths/~1api~1v2~1b2b-payments~1sellers/post/responses/200/content/application~1json/schema'
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
  /api/v2/b2b-payments/sellers/{id}:
    get:
      tags:
      - Seller
      operationId: get-seller-v2
      summary: Get Seller
      description: For getting a certain seller's details, you'll only need the seller's ID specified on creation.
      parameters:
      - name: id
        description: ID of the seller as specified on seller creation.
        in: path
        required: true
        schema:
          $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
      responses:
        '200':
          description: Details of the requested seller.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v2~1b2b-payments~1sellers/post/responses/200/content/application~1json/schema'
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '404':
          description: No seller found for the given ID.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/400/content/application~1json/schema/allOf/0'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - seller_invalid
                    description:
                      example: Seller with ID seller-000 does not exist
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
    patch:
      tags:
      - Seller
      x-tags:
      - PatchSeller
      operationId: update-seller-v2
      summary: Update Seller
      description: 'Update a seller if certain data changes on your platform. For this you''ll need:

        1. The seller''s ID specified on creation

        2. The data you want to change

        '
      parameters:
      - $ref: '#/paths/~1api~1v2~1b2b-payments~1sellers~1{id}/get/parameters/0'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                legal_name:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/legal_name/allOf/0'
                  - description: New legal name of the business.
                    example: HappyCandles GmbH
                email:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/email/allOf/0'
                  - description: New email address of the seller.
                    example: happy-candles@example.com
                phone:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/phone/allOf/0'
                  - description: New phone number of the seller.
                    example: '+49987654321'
                legal_address:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/legal_address/allOf/0'
                  - description: New legal address of the seller.
                    example:
                      address_line_1: Musterweg 100 a
                      postal_code: '54321'
                      city: Musterhausen
                      state: Brandenburg
                      country: DEU
        required: true
      responses:
        '200':
          description: Updated seller details.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v2~1b2b-payments~1sellers/post/responses/200/content/application~1json/schema'
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '404':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1sellers~1{id}/get/responses/404'
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
  /api/v2/b2b-payments/sellers/{id}/bank-details:
    patch:
      tags:
      - Seller
      x-tags:
      - PatchSeller
      operationId: update-seller-bank-account-v2
      summary: Update Seller Bank Account
      description: "Update a seller's bank account details. For this you'll need:  1. The seller's ID specified on creation\n2. The new bank account details. \nNote: This currently is only supported for sellers with a single bank account.\n"
      parameters:
      - $ref: '#/paths/~1api~1v2~1b2b-payments~1sellers~1{id}/get/parameters/0'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - bank_account
              properties:
                bank_account:
                  oneOf:
                  - title: SEPA Account
                    type: object
                    required:
                    - iban
                    - currency
                    properties:
                      iban:
                        description: IBAN of the seller.
                        type: string
                      bic:
                        description: BIC of the seller's bank.
                        type: string
                      currency:
                        allOf:
                        - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1{id}~1payment-limit/get/parameters/1/schema/allOf/0'
                  - title: FPS Account
                    type: object
                    required:
                    - sort_code
                    - account_number
                    - currency
                    properties:
                      sort_code:
                        description: 6-digit sort code of the seller's account.
                        type: string
                        minLength: 6
                        maxLength: 6
                        pattern: ^\d+$
                      account_number:
                        description: 8-digit number of the seller's account.
                        type: string
                        minLength: 8
                        maxLength: 8
                        pattern: ^\d+$
                      bank_code:
                        description: Bank code of the seller's account.
                        type: string
                        minLength: 4
                        maxLength: 4
                      currency:
                        allOf:
                        - description: Three-letter currency code (ISO 4217). Supported currencies `GBP`.
                          type: string
                          example: GBP
        required: true
      responses:
        '200':
          description: Updated seller details.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v2~1b2b-payments~1sellers/post/responses/200/content/application~1json/schema'
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '404':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1sellers~1{id}/get/responses/404'
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
  /api/v2/b2b-payments/simulation/buyer:
    patch:
      tags:
      - Simulation
      operationId: simulate-buyer-v2
      summary: Simulate Buyer
      description: 'This endpoint allows you to simulate onboarding of buyers in the sandbox environment. After creation buyers have the status of `PENDING`. In a production environment finmid runs certain checks before a buyer is actually set `ACTIVE`. However, in the sandbox environment finmid does not run any checks nor sets the created buyer `ACTIVE` automatically.


        Use this API to onboard created buyers by setting their `status` to `ACTIVE`. Don''t forget to set their `expense_limit` to a value greater `0` (e.g. `10000`) as well. You can also simulate other flows as well. For example setting the status to `REJECTED` to simulate rejection of a buyer.

        > 🚧

        >

        > **Only available in sandbox environment.**

        '
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - buyer_id
              properties:
                buyer_id:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
                  - description: ID of the buyer.
                    example: buyer-123
                status:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1list/get/parameters/0/schema/items'
                  - description: New simulated status of the buyer.
                    example: ACTIVE
                expense_limit:
                  type: number
                  description: New simulated expense limit of the buyer.
                  minimum: 0
        required: true
      responses:
        '200':
          description: Buyer updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/200/content/application~1json/schema'
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '404':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1{id}/get/responses/404'
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
  /api/v2/b2b-payments/simulation/payment-requests/repayment:
    post:
      tags:
      - Simulation
      operationId: simulate-payment-request-repayment-v2
      summary: Simulate Repayment
      description: 'This endpoint simulates repayment of a payment request. The payment request status must be `PENDING_REPAYMENT`.

        > 🚧

        >

        > **Only available in sandbox environment.**

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - payment_request_id
              properties:
                payment_request_id:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
      responses:
        '200':
          description: Payment request repayment successful.
