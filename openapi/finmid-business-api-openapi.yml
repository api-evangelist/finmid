          $ref: '#/paths/~1api~1v1~1capital~1businesses/post/responses/500'
  /api/v1/capital/businesses/{business_id}/performance-data:
    post:
      tags:
      - Business
      operationId: submit-business-performance-data
      summary: Submit Business performance data
      description: 'In order to generate Offers, finmid requires that Platforms share non-PI data on key Business performance indicators (e.g., goods sold, number of transactions, ratings, refund count, etc.). This data is used to confirm the Business''s eligibility for an Offer and to determine the terms of the Offer.


        **Guidelines:**


        - Multiple data points across multiple months may be submitted in a single API call.

        - All data points within a single API call must be associated with the same Business ID.

        - An API request must include at least one performance indicator per reported date; a request with an empty indicator object will be considered invalid.

        - Only completed reporting periods can be submitted. finmid aggregates the data at the resolution agreed during your integration setup, so a data point is accepted once the period it belongs to has ended: with monthly aggregation, any `report_date` inside the current month is rejected until the month is over, including a `YYYY-MM-DD` date; with daily aggregation, the current day is rejected until it is over.

        - If a single data point covers a period that has not ended yet, the whole request is rejected with `validation_error`.'
      parameters:
      - $ref: '#/paths/~1api~1v1~1capital~1businesses~1{business_id}/get/parameters/0'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                - report_date
                - indicators
                properties:
                  report_date:
                    type: string
                    pattern: ^[0-9]{4}-[0-9]{2}(-[0-9]{2})?$
                    description: 'ISO 8601 date format. Either YYYY-MM (e.g., "2023-01") or YYYY-MM-DD (e.g., "2023-01-31").


                      The reporting period must have ended. finmid aggregates the data at the resolution agreed during

                      your integration setup: with monthly aggregation a date inside the current month is rejected until

                      the month is over, and with daily aggregation the current day is rejected until it is over. If a

                      single data point covers a period that has not ended yet, the whole request is rejected with

                      `validation_error`.

                      '
                    example: 2023-01
                  indicators:
                    description: 'Set of indicators to be reported. At least one indicator must be sent in this object.


                      | Indicator | Format | Description | Required |

                      | --- | --- | --- | --- |

                      | `sales_amount` | float, up to 2 decimal numbers | Amount of aggregated sales in the currency of the business. | No |

                      | `transactions_count` | integer | Total number of transactions performed. | No |

                      | `refund_count` | integer | The number of refunds the business had | No |

                      | `rating_value` | float | The average rating for the reported period | No |

                      | `ratings_count` | integer | Number of ratings submitted from the customers | No |

                      | `end_balance` | float | End of month account balance | No |

                      | `incoming_amount` | float | Volume of incoming transactions | No |

                      | `outgoing_amount` | float | Volume of outgoing transactions | No |

                      | `incoming_transaction_count` | integer | Number of incoming transactions | No |

                      | `outgoing_transaction_count` | integer | Number of outgoing transactions | No |

                      '
                    type: object
                    additionalProperties: true
                    example:
                      sales_amount: 3421.88
                      transactions_count: 148
                      refund_count: 13
                      rating_value: 3.45
                      ratings_count: 500
            examples:
              performance_data_year_month:
                value:
                - reportDate: 2023-01
                  indicators:
                    sales_amount: 3421.88
                    transactions_count: 148
                    refund_count: 13
                    rating_value: 3.45
                    ratings_count: 500
                    end_balance: 4135.54
                    incoming_amount: 89722.52
                    outgoing_amount: 92895.25
                    incoming_transaction_count: 52
                    outgoing_transaction_count: 46
                - reportDate: 2023-02
                  indicators:
                    sales_amount: 11.12
              performance_data_year_month_day:
                value:
                - reportDate: '2023-03-31'
                  indicators:
                    sales_amount: 11.12
        required: true
      responses:
        '204':
          description: Performance data accepted.
        '400':
          description: Can't process request due to validation reasons.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/paths/~1api~1v1~1transaction/post/responses/400/content/application~1json/schema/allOf/0'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - validation_error
              examples:
                validation_error:
                  summary: The request does not match the expected format
                  value:
                    code: validation_error
                    description: Some fields of the request don't match requirements.
                report_date_not_elapsed:
                  summary: A data point covers a reporting period that has not ended yet
                  value:
                    code: validation_error
                    description: 'reportDate must be before 2023-04, got: 2023-04'
        '401':
          $ref: '#/paths/~1api~1v1~1capital~1businesses/post/responses/401'
        '404':
          $ref: '#/paths/~1api~1v1~1capital~1businesses~1{business_id}/get/responses/404'
        '500':
          $ref: '#/paths/~1api~1v1~1capital~1businesses/post/responses/500'
