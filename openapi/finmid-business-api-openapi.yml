  /api/v1/capital/businesses/{business_id}/non-pi:
    put:
      tags:
      - Business
      operationId: update-business-non-pi
      summary: Update Business non-PI Data
      description: 'Update non-personally identifiable data for an existing Business.


        This endpoint can be used only for Businesses non-PI data updates. After KYB data is shared for a business this API will return an error.


        > 📘

        >

        > Please note that this API is replacing all non-PI data for a Business. It is **not** a `PATCH` operation.'
      parameters:
      - $ref: '#/paths/~1api~1v1~1capital~1businesses~1{business_id}/get/parameters/0'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bank_account:
                  $ref: '#/paths/~1api~1v1~1capital~1businesses/post/requestBody/content/application~1json/schema/properties/bank_account'
                legal_representative:
                  $ref: '#/paths/~1api~1v1~1capital~1businesses/post/requestBody/content/application~1json/schema/properties/legal_representative'
                metadata:
                  type: object
                  description: 'Contains a set of flexible, custom key-value pairs. Used for sharing extra data.


                    Notable key: `mcc` — accepts a comma-separated string (`"5411,5812"`) or an array of

                    strings; stored and returned as a comma-separated string. See Create Business for details.

                    '
                  additionalProperties: true
                  example:
                    key: value
                partnership_started_date:
                  description: Date when the Business started its partnership with the Platform.
                  type: string
                  format: date
                  example: '2020-01-01'
                founding_date:
                  description: Date when the Business was established.
                  type: string
                  format: date
                  example: '2020-01-01'
            examples:
              update_business_non_pi:
                value:
                  bank_account:
                    account_number_ending: '4422'
                  legal_representative:
                    phone_ending: '5511'
                  metadata:
                    mcc: 5411,5812
                    mcc_translation: Grocery stores
                  partnership_started_date: '2025-04-01'
                  founding_date: '2025-04-01'
        required: true
      responses:
        '200':
          description: Business updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v1~1capital~1businesses/post/responses/201/content/application~1json/schema'
              examples:
                business_updated:
                  value:
                    id: business-id
                    legal_name: null
                    business_registration_number: null
                    tax_number: null
                    bank_account:
                      account_number: null
                      bic: null
                      account_holder_name: null
                      account_number_ending: '4422'
                    currency: EUR
                    legal_representative:
                      first_name: null
                      last_name: null
                      phone: null
                      email: null
                      phone_ending: '5511'
                    legal_address:
                      address_line1: null
                      address_line2: null
                      postal_code: null
                      city: null
                      state: null
                      country: DEU
                    partnership_started_date: '2025-04-01'
                    founding_date: '2025-04-01'
                    metadata:
                      mcc: 5411,5812
                      mcc_translation: Grocery stores
        '400':
          description: Can't process request due to validation reasons.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/paths/~1api~1v1~1transaction/post/responses/400/content/application~1json/schema/allOf/0'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - validation_error
                    description:
                      example: Some fields of the request don't match requirements.
              examples:
                validation_error:
                  value:
                    code: validation_error
                    description: Some fields of the request don't match requirements.
        '401':
          $ref: '#/paths/~1api~1v1~1capital~1businesses/post/responses/401'
        '404':
