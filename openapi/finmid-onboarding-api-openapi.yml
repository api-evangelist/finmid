- url: https://api.finmid.com
  description: Live
security:
- apiKeyScheme: []
tags:
- name: Onboarding
paths:
  /api/v1/capital/businesses/{business_id}/onboardings/latest:
    get:
      tags:
      - Onboarding
      operationId: get-latest-onboarding
      summary: Get latest onboarding status
      deprecated: true
      description: 'This endpoint retrieves the latest onboarding status for a business.


        The onboarding process collects information from the business to generate offers in cases when

        platform doesn''t have enough data to create pre-approved offers.

        This endpoint provides information about the current state of the onboarding process,

        including submission and review timestamps, and rejection reasons if applicable.


        The status transitions as follows:

        - `AVAILABLE` → `IN_REVIEW` (when submitted)

        - `IN_REVIEW` → `APPROVED` (when approved)

        - `IN_REVIEW` → `REJECTED` (when rejected)'
      parameters:
      - $ref: '#/paths/~1api~1v1~1capital~1businesses~1{business_id}/get/parameters/0'
      responses:
        '200':
          description: Current onboarding status for the business
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    description: 'Current status of the business onboarding process.


                      - `AVAILABLE`: Onboarding is available and can be started

                      - `IN_REVIEW`: Onboarding has been submitted and is under review

                      - `APPROVED`: Onboarding has been approved

                      - `REJECTED`: Onboarding has been rejected

                      '
                    enum:
                    - AVAILABLE
                    - IN_REVIEW
                    - APPROVED
                    - REJECTED
                    example: IN_REVIEW
                  submitted_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: Timestamp when the onboarding was submitted for review (ISO 8601 UTC)
                    example: '2025-02-10T13:42:35.282908722Z'
                  reviewed_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: Timestamp when the onboarding was reviewed (approved or rejected) (ISO 8601 UTC)
                    example: '2025-02-11T13:42:35.282908722Z'
                  rejection_reason:
                    type:
                    - string
                    - 'null'
                    description: Reason for rejection if status is REJECTED
                    example: INSOLVENCY
              examples:
                available:
                  value:
                    status: AVAILABLE
                    submitted_at: null
                    reviewed_at: null
                    rejection_reason: null
                in_review:
                  value:
                    status: IN_REVIEW
                    submitted_at: '2025-02-10T13:42:35.282908722Z'
                    reviewed_at: null
                    rejection_reason: null
                approved:
                  value:
                    status: APPROVED
                    submitted_at: '2025-02-10T13:42:35.282908722Z'
                    reviewed_at: '2025-02-11T13:42:35.282908722Z'
                    rejection_reason: null
                rejected:
                  value:
                    status: REJECTED
                    submitted_at: '2025-02-10T13:42:35.282908722Z'
                    reviewed_at: '2025-02-11T13:42:35.282908722Z'
                    rejection_reason: INSOLVENCY
        '401':
          $ref: '#/paths/~1api~1v1~1capital~1businesses/post/responses/401'
        '404':
          $ref: '#/paths/~1api~1v1~1capital~1businesses~1{business_id}/get/responses/404'
        '500':
          $ref: '#/paths/~1api~1v1~1capital~1businesses/post/responses/500'
components:
