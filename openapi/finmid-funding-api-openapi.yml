                          type: string
                          format: date-time
                          example: '2024-01-01T00:00:00.000Z'
                        due_at:
                          description: Timestamp in UTC when the Funding is expected to be paid (ISO 8601 datetime).
                          type: string
                          format: date-time
                          example: '2025-01-01T00:00:00.000Z'
                        paid_at:
                          description: Timestamp in UTC when the Funding was completely paid by business (ISO 8601 datetime).
                          type:
                          - string
                          - 'null'
                          format: date-time
                          example: '2025-11-01T00:00:00.000Z'
                        paid_out_at:
