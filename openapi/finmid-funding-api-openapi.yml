  /api/v1/capital/credits/{credit_id}/payments:
    get:
      tags:
      - Funding
      operationId: get-payments-for-credit
      summary: Get Funding payments
      description: 'Retrieve all payments for a specific Funding.


        See also:

        - `payment.scheduled` webhook

        - `payment.completed` webhook

        - `payment.failed` webhook

        - `payment.cancelled` webhook'
      parameters:
      - name: credit_id
        in: path
        description: Identifier of the Funding.
        required: true
        schema:
          type: string
          format: uuid
        example: 20e9a201-9b22-4768-887b-1b7559b699c6
      responses:
        '200':
          description: List of Funding payments ordered by `scheduled_at`.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    description: List of Funding payments.
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - status
                      - repayment_amount
                      - scheduled_at
                      - expected_at
                      - completed_at
                      - sales_amount
                      properties:
                        id:
                          description: Unique identifier of the payment.
                          type: string
                          example: 25-08-abcde
                        status:
                          description: 'Status of the Funding payment.


                            - `PENDING`: Payment is not yet processed (it may have left the Business’s bank account but has not been confirmed as received by our system).

                            - `COMPLETED`: Payment has been successfully received and processed.

                            - `FAILED` : Payment either failed or was revoked by the Business.

                            '
                          type: string
                          enum:
                          - PENDING
                          - COMPLETED
                          - FAILED
                          - CANCELLED
                          example: PENDING
                        repayment_amount:
                          allOf:
                          - $ref: '#/paths/~1api~1v1~1capital~1simulation~1credits/post/responses/200/content/application~1json/schema/allOf/0/properties/fee/allOf/1'
                          - description: The amount that is going to be debited from the Business bank account.
                            example: 150
                        scheduled_at:
                          description: Date when Payment is planned to be debited from the Business bank account.
                          type: string
                          format: date
                          example: '2025-08-15'
                        cancelled_at:
                          description: Date when Payment was cancelled.
                          type:
                          - string
                          - 'null'
                          format: date
                          example: '2025-08-15'
                        expected_at:
                          description: Date when Payment is expected to be received, processed and reflected on the Funding outstanding amount. Not null value means that Payment collection has already been scheduled with the bank.
                          type:
                          - string
                          - 'null'
                          format: date
                          example: '2025-08-17'
                        completed_at:
                          description: Date when Payment was processed and reflected on the Funding outstanding amount.
                          type:
                          - string
                          - 'null'
                          format: date
                          example: '2025-08-17'
                        sales_amount:
                          allOf:
                          - $ref: '#/paths/~1api~1v1~1capital~1simulation~1credits/post/responses/200/content/application~1json/schema/allOf/0/properties/fee/allOf/1'
                          - description: Sales used to calculate the repayment amount. Not null only for Fundings with FLEXIBLE repayment type.
                            example: 1000
                        partial_payments:
                          description: A single payment may be received partly in multiple portions. This field represents all portions that were paid for a specific payment. I.e. payment amount is 1000 and we received only 200 and 700 so far. This field can be null if the payment was received in full as single transaction or if no payment has been received yet.
                          type:
                          - array
                          - 'null'
                          items:
                            type: object
                            required:
                            - amount
                            - reconciled_at
                            properties:
                              amount:
                                allOf:
                                - $ref: '#/paths/~1api~1v1~1capital~1simulation~1credits/post/responses/200/content/application~1json/schema/allOf/0/properties/fee/allOf/1'
                                - description: The partial payment amount.
                                  example: 75
                              reconciled_at:
                                description: Timestamp when the partial payment was reconciled (ISO 8601 datetime).
                                type: string
                                format: date-time
                                example: '2025-08-16T14:30:00Z'
              examples:
                funding_payments:
                  value:
                    data:
                    - id: 25-08-abcde
                      status: COMPLETED
                      repayment_amount: 200
                      scheduled_at: '2025-08-15'
                      expected_at: '2025-08-18'
                      completed_at: '2025-08-18'
                      sales_amount: null
                      partial_payments:
                      - amount: 75
                        reconciled_at: '2025-08-16T14:30:00Z'
                      - amount: 125
                        reconciled_at: '2025-08-17T09:15:00Z'
                    - id: 25-09-abcde
                      status: FAILED
                      repayment_amount: 200
                      scheduled_at: '2025-09-15'
                      expected_at: '2025-09-17'
                      completed_at: null
                      sales_amount: null
                      partial_payments: null
                    - id: 25-10-abcde
                      status: PENDING
                      repayment_amount: 200
                      scheduled_at: '2025-10-15'
                      expected_at: '2025-10-17'
                      completed_at: null
                      sales_amount: null
                      partial_payments: null
                    - id: 25-11-abcde
                      status: PENDING
                      repayment_amount: 200
                      scheduled_at: '2025-11-15'
                      expected_at: null
                      completed_at: null
                      sales_amount: null
                      partial_payments: null
                    - id: 25-12-abcde
                      status: PENDING
                      repayment_amount: 200
                      scheduled_at: '2025-12-15'
                      expected_at: null
                      completed_at: null
                      cancelled_at: '2025-12-15'
                      sales_amount: null
                      partial_payments: null
        '401':
          $ref: '#/paths/~1api~1v1~1capital~1businesses/post/responses/401'
        '404':
          description: Funding not found
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/paths/~1api~1v1~1transaction/post/responses/400/content/application~1json/schema/allOf/0'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - credit_not_found
                    description:
                      example: Credit with id '20e9a201-9b22-4768-887b-1b7559b699c6' not found
              examples:
                funding_not_found:
                  value:
                    code: credit_not_found
                    description: Credit with id '20e9a201-9b22-4768-887b-1b7559b699c6' not found
        '500':
          $ref: '#/paths/~1api~1v1~1capital~1businesses/post/responses/500'
