openapi: 3.2.0
info:
  title: CAPITAL Funding API
  version: v1.0
servers:
- url: https://sandbox.finmid.com
  description: Sandbox
- url: https://api.finmid.com
  description: Live
security:
- apiKeyScheme: []
tags:
- name: Funding
paths:
  /api/v1/capital/businesses/{business_id}/credits:
    get:
      tags:
      - Funding
      operationId: get-fundings-for-business
      summary: Get Fundings
      description: 'The endpoint provides information about the Funding of the Business.


        Depending on the presence and status of the current Funding, Platforms can communicate different details to the Business in their UI.


        > 📘

        >

        > finmid API supports `capital_funding.created` webhook to communicate when an Offer was accepted by a business and a Funding was created.'
      parameters:
      - $ref: '#/paths/~1api~1v1~1capital~1businesses~1{business_id}/get/parameters/0'
      - name: statuses
        in: query
        description: Filter for status of the Funding.
        required: false
        schema:
          type: array
          items:
            description: Status of the Funding.
            type: string
            enum:
            - PENDING
            - PAID
            - REFINANCED
            - REJECTED
            - CANCELLED
            - DEFAULTED
        example:
        - PENDING
        - PAID
      responses:
        '200':
          description: List of Fundings ordered by `accepted_at` in descending order.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    description: List of Fundings.
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - business_id
                      - limit
                      - fee
                      - payment_type
                      - repaid_amount
                      - total_amount_paid
                      - total_amount_reconciled
                      - currency
                      - country
                      - accepted_at
                      - due_at
                      - paid_at
                      - estimated_payoff_months
                      - status
                      - payout_amount
                      properties:
                        id:
                          description: Unique identifier of the Funding.
                          type: string
                          format: uuid
                          example: 20e9a201-9b22-4768-887b-1b7559b699c6
                        business_id:
                          description: Identifier of the Business to which this Funding belongs.
                          example: business-id
                          $ref: '#/paths/~1api~1v1~1capital~1payment-batches~1{batch_id}/get/parameters/0/schema'
                        limit:
                          allOf:
                          - $ref: '#/paths/~1api~1v1~1capital~1simulation~1credits/post/responses/200/content/application~1json/schema/allOf/0/properties/fee/allOf/1'
                          - description: Funding limit.
                            example: 1000
                        fee:
                          allOf:
                          - $ref: '#/paths/~1api~1v1~1capital~1simulation~1credits/post/responses/200/content/application~1json/schema/allOf/0/properties/fee/allOf/1'
                          - description: The total cost of the funding for the business.
                            example: 100
                        repayment_percent:
                          deprecated: true
                          allOf:
                          - $ref: '#/paths/~1api~1v1~1capital~1simulation~1credits/post/responses/200/content/application~1json/schema/allOf/0/properties/fee/allOf/1'
                          - description: Payment percentage. Deprecated, use `payment_percentage` instead.
                            example: 15
                        payment_percentage:
                          allOf:
                          - $ref: '#/paths/~1api~1v1~1capital~1simulation~1credits/post/responses/200/content/application~1json/schema/allOf/0/properties/fee/allOf/1'
                          - description: 'Payment percentage. Percentage of the sales amount that will be deducted from the business''s sales.


                              Only applicable to `FLEXIBLE` `payment_type`.

                              '
                            example: 15
                        payment_amount:
                          allOf:
                          - $ref: '#/paths/~1api~1v1~1capital~1simulation~1credits/post/responses/200/content/application~1json/schema/allOf/0/properties/fee/allOf/1'
                          - description: 'Payment amount. Amount which business keeps paying for their funding on `payment_frequency` basis.


                              Only applicable to `FIXED` `payment_type`.

                              '
                            example: 200
                        payment_frequency:
                          description: 'Frequency in which business keeps paying a fixed amount (`payment_amount`) for their funding.

                            For instance, 200 EUR / week.


                            Only applicable to `FIXED` `payment_type`.

                            '
                          type: string
                          enum:
                          - WEEKLY
                          - MONTHLY
                          example: WEEKLY
                        payment_type:
                          description: 'Payment type is defining the way business pays for their funding.


                            - `FLEXIBLE` means a percentage (`payment_percentage`) of their sales.

                            - `FIXED` means a fixed amount (`payment_amount`) at a certain frequency (`payment_frequency`).

                            '
                          type: string
                          enum:
                          - FIXED
                          - FLEXIBLE
                          example: FLEXIBLE
                        repaid_amount:
                          deprecated: true
                          allOf:
                          - $ref: '#/paths/~1api~1v1~1capital~1simulation~1credits/post/responses/200/content/application~1json/schema/allOf/0/properties/fee/allOf/1'
                          - description: Paid amount. Deprecated, use `total_amount_paid` instead.
                            example: 123.45
                        total_amount_paid:
                          allOf:
                          - $ref: '#/paths/~1api~1v1~1capital~1simulation~1credits/post/responses/200/content/application~1json/schema/allOf/0/properties/fee/allOf/1'
                          - description: The amount, that has already been deducted from business for this funding. Can be higher than `total_amount_reconciled`.
                            example: 123.45
                        total_amount_reconciled:
                          allOf:
                          - $ref: '#/paths/~1api~1v1~1capital~1simulation~1credits/post/responses/200/content/application~1json/schema/allOf/0/properties/fee/allOf/1'
                          - description: The amount, that has already been deducted from the business and reconciled by Finmid.
                            example: 110.5
                        currency:
                          allOf:
                          - $ref: '#/paths/~1api~1v1~1capital~1payment-batches~1{batch_id}~1incoming-funds/post/requestBody/content/application~1json/schema/properties/currency/allOf/0'
                          - description: Three-letter currency code (ISO 4217).
                        country:
                          allOf:
                          - description: Country code (ISO 3166-1 alpha-3, e.g. `DEU`, `USA`).
                            type: string
                            example: DEU
