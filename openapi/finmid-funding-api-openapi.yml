                            - `PAID`: funding has already been repaid.

                            - `REFINANCED` : funding has been refinanced. This means the new funding with higher limit has been accepted and this funding has been closed.

                            - `REJECTED` : funding payout has been rejected due to failed KYB check.

                            - `CANCELLED`: funding has been cancelled before being paid out.

                            - `DEFAULTED`: funding has been terminated before full repayment due to insolvency.

                            '
