                  - description: Legal address of the buyer.
                    required:
                    - address_line_1
                    - postal_code
                    - city
                    - country
                    example:
                      address_line_1: Musterstraße 1
                      postal_code: '11225'
                      city: Musterstadt
                      state: Saarland
                      country: DEU
        required: true
      responses:
        '200':
          description: The buyer was created successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                - legal_name
                - legal_address
                properties:
                  id:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
                    - description: ID of the buyer.
                      example: buyer-123
                  status:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1list/get/parameters/0/schema/items'
                    - description: Current status of the buyer.
                      example: PENDING
                  legal_name:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/legal_name/allOf/0'
                    - description: Legal name of the buyer's business.
                      example: Tante Emma GmbH
                  business_registration_number:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/business_registration_number/allOf/0'
                    - description: Business registration number of the buyer.
                      example: HRB123456B
                  tax_number:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/tax_number/allOf/0'
                    - description: 'Identification number assigned to the buyer by local tax office.

                        '
                      example: 12/345/67890
                  email:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/email/allOf/0'
                    - description: Email address of the buyer.
                      example: emma@example.com
                  phone:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/phone/allOf/0'
                    - description: Phone number of the buyer in the international format (e.g. `+49123456789`).
                      example: '+49123456789'
                  legal_address:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/legal_address/allOf/0'
                    - description: Legal address of the buyer.
                      required:
                      - address_line_1
                      - postal_code
                      - city
                      - country
                      example:
                        address_line_1: Musterstraße 1
                        postal_code: '11225'
                        city: Musterstadt
                        state: Saarland
                        country: DEU
        '400':
          description: The request is invalid and failed validation.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - code
                  - description
                  properties:
                    code:
                      allOf:
                      - type: string
                        enum:
                        - validation_error
                        - server_error
                        - buyer_invalid
                        - seller_invalid
                        - platform_invalid
                        - payment_request_invalid
                        - line_item_invalid
                        - buyer_conflict
                        - seller_conflict
                        - payment_request_conflict
                        - business_conflict
                        - business_not_found
                        - document_already_exists
                        - incoming_webhook_conflict
                        - mcc_not_eligible
                        - offer_group_not_active
                        - offer_group_not_found
                        - platform_check_already_consumed
                        - platform_check_not_required
                        - platform_check_unavailable
                        - platform_checks_not_enabled
                      - description: Code that represents the kind of error.
                    description:
                      allOf:
                      - type: string
                      - description: A more detailed description of the error.
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - validation_error
                    description:
                      example: legal_name must not be blank
        '401':
          description: Missing or invalid API key. Could not authenticate API request.
        '409':
          description: Buyer exists already.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/400/content/application~1json/schema/allOf/0'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - buyer_conflict
                    description:
                      example: Cannot create this buyer because it exists already
        '500':
          description: An unexpected server error occurred. You should try again later or contact finmid support.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/400/content/application~1json/schema/allOf/0'
                - properties:
                    code:
                      type: string
                      enum:
                      - server_error
                    description:
                      example: Our server was hit by a meteorite 💥.
              examples:
                server_error:
                  value:
                    code: server_error
                    description: Internal processing error
  /api/v2/b2b-payments/buyers/list:
    get:
      tags:
      - Buyer
      operationId: get-buyers-for-platform
      summary: Get Buyers
      description: Returns a list of buyers. Cursor-based pagination is supported and you can make use of filter parameters to change sorting or limit the results to only buyers with certain status..
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: array
          description: 'List of buyer status. Providing one or more status only includes buyers that have one of the provided status.

            '
          items:
            type: string
            enum:
            - PENDING
            - ACTIVE
            - INACTIVE
            - REJECTED
            - SUSPENDED
      - name: sort_by
        in: query
        required: false
        schema:
          description: Sorting of the results.
          type: string
          enum:
          - CREATED_ASC
          - CREATED_DESC
      - name: cursor
        in: query
        required: false
        schema:
          description: A cursor used for pagination.
          example: cGktMTIzNDV8MjAyMi0wNC0yOFQwNjowOToxNyswMDowMAo=
          type: string
      - name: limit
        in: query
        required: false
        schema:
          description: Limits the amount of results per page.
          example: 20
          type: integer
          format: int32
          default: 100
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: A result set containing details of buyers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      next_cursor:
                        type: string
                        description: A cursor pointing to the beginning of the next page.
                        example: ddTkVYVHxmMzA1ZjBlNi00YzM2LTQwZmEtOTI5YS0yZjJiODJlYjU2ZjR8MjAyMi0xMC0yOFQxMDoxMDoyOS4zMTkzMDlafA
                      previous_cursor:
                        type: string
                        description: A cursor pointing to the beginning of the previous page.
                        example: ccUFJFVklPVVN8ZjhjODRmYzctZDIyMS00NzYxLThlMTktN2QxYTM5ZTIyZDgxfDIwMjItMTEtMDJUMTM6NTE6MTkuMzI3MTk1Wnw
                  data:
                    description: List of Buyers.
                    type: array
                    items:
                      $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/200/content/application~1json/schema'
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
  /api/v2/b2b-payments/buyers/{id}:
    get:
      tags:
      - Buyer
      operationId: get-buyer-v2
      summary: Get Buyer
      description: For getting a certain buyer's details, you'll only need the buyer's ID specified on creation.
      parameters:
      - name: id
        description: ID of the buyer as specified on buyer creation.
        in: path
        required: true
        schema:
          $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
      responses:
        '200':
          description: Details of the requested buyer.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/200/content/application~1json/schema'
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '404':
          description: No buyer found for the given ID.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/400/content/application~1json/schema/allOf/0'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - buyer_invalid
                    description:
                      example: Buyer with ID buyer-000 does not exist
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
    patch:
      tags:
      - Buyer
      x-tags:
      - PatchBuyer
      operationId: update-buyer-v2
      summary: Update Buyer
      description: 'Update a buyer if certain data changes on your platform. For this you''ll need:

        1. The buyer''s ID specified on creation

        2. The data you want to change'
      parameters:
      - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1{id}/get/parameters/0'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                legal_name:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/legal_name/allOf/0'
                  - description: New legal name of the business.
                    example: Onkel Ernie GmbH
                email:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/email/allOf/0'
                  - description: New email address of the buyer.
                    example: ernie@example.com
                phone:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/phone/allOf/0'
                  - description: New phone number of the buyer.
                    example: '+49987654321'
                legal_address:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/requestBody/content/application~1json/schema/properties/legal_address/allOf/0'
                  - description: New legal address of the buyer.
                    example:
                      address_line_1: Mustergasse 1
                      postal_code: '12345'
                      city: Musterstadt
                      state: Niedersachsen
                      country: DEU
        required: true
      responses:
        '200':
          description: Updated buyer details.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/200/content/application~1json/schema'
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '404':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1{id}/get/responses/404'
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
  /api/v2/b2b-payments/buyers/{id}/payment-limit:
    get:
      tags:
      - Buyer
      operationId: get-buyer-limit-v2
      summary: Get Buyer Limit
      description: 'Get estimated buyer limit in a target currency.

        > 📘

        >

        > Note: this limit is an estimate and subject to change depending on a specific payment request parameters. To verify if specific purchase can be financed please use Check Payment Request API'
      parameters:
      - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1{id}/get/parameters/0'
      - name: currency
        in: query
        required: false
        schema:
          allOf:
          - description: Three-letter currency code (ISO 4217). Supported currencies `EUR`, `GBP`, and `USD`.
            type: string
            example: EUR
      responses:
        '200':
          description: Estimated limit for the buyer.
          content:
            application/json:
              schema:
                type: object
                required:
                - estimated_remaining_limit
                - currency
                - total_limit
                - used_limit
                - pending_requests_amount
                properties:
                  estimated_remaining_limit:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                    - description: Estimated available amount which could be approved for payment request for the buyer.
                      example: 9000
                  total_limit:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                    - description: Estimated maximum amount of all open buyer's payment requests.
                      example: 10000
                  used_limit:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                    - description: Sum of all pending and reserved buyer's payment requests.
                      example: 1000
                  pending_requests_amount:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests/post/requestBody/content/application~1json/schema/properties/total_amount/allOf/0'
                    - description: Sum of all reserved but not pending for repayment buyer's payment requests.
                      example: 500
                  currency:
                    allOf:
                    - $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1{id}~1payment-limit/get/parameters/1/schema/allOf/0'
                    - description: Three-letter currency code (ISO 4217). Supported currencies `EUR` and `GBP`
                      example: EUR
        '401':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/401'
        '404':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers~1{id}/get/responses/404'
        '500':
          $ref: '#/paths/~1api~1v2~1b2b-payments~1buyers/post/responses/500'
components:
  securitySchemes:
    apiKeyScheme:
      type: apiKey
      in: header
      name: X-API-KEY
