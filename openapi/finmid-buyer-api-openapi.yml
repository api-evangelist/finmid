openapi: 3.2.0
info:
  title: B2B Payments Buyer API
  version: v2.3
servers:
- url: https://sandbox.finmid.com
  description: Sandbox
- url: https://api.finmid.com
  description: Live
security:
- apiKeyScheme: []
tags:
- name: Buyer
paths:
  /api/v2/b2b-payments/buyers:
    post:
      tags:
      - Buyer
      operationId: create-buyer-v2
      summary: Create Buyer
      description: 'Let''s create/onboard a new buyer. For this you''ll need 2 things:

        1. Create a new ID for this buyer (should map to your internal identifier)

        2. The buyer''s legal information. ⚠️ Note that one of either business_registration_number or tax_number **must** be provided on creation.


        > 📘

        >

        > You should create a buyer entity for every buyer on your platform that can be part of a lending transaction.'
      requestBody:
        content:
          application/json:
            schema:
              required:
              - id
              - legal_name
              - legal_address
              - email
              type: object
              properties:
                id:
                  allOf:
                  - $ref: '#/paths/~1api~1v2~1b2b-payments~1payment-requests~1{id}~1cancel/put/parameters/0/schema/allOf/0'
                  - description: 'Custom ID of the buyer, should map to your internal identifier. Must consist only of a-z, A-Z, 0-9 and .-_ characters, and length should not exceed 100 characters.

                      '
                    example: buyer-123
                legal_name:
                  allOf:
                  - type: string
                    maxLength: 100
                  - description: 'Business name of the buyer (not necessarily the brand name). This should be the name as stated in official business registers.

                      '
                    example: Tante Emma GmbH
                business_registration_number:
                  allOf:
                  - type: string
                    maxLength: 100
                  - description: 'Registration number of the buyer from the commercial register.

                      '
                    example: HRB123456B
                tax_number:
                  allOf:
                  - type: string
                    maxLength: 100
                  - description: 'Identification number assigned to the buyer by local tax office. > ⚠️ This field must be provided in case the business registration number is omitted.

                      '
                    example: 12/345/67890
                email:
                  allOf:
                  - type: string
                    format: email
                    pattern: ^(?:[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+)*|"(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21\x23-\x5b\x5d-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])*")@(?:(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?|\[(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?|[a-zA-Z0-9-]*[a-zA-Z0-9]:(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21-\x5a\x53-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])+)\])$
                  - description: Email address of the buyer.
                    example: emma@example.com
                phone:
                  allOf:
                  - type: string
                    pattern: ^\+[0-9]+$
                    minLength: 4
                    maxLength: 30
                  - description: Phone number of the buyer. Must be provided in the international format, e.g. `+49123456789`.
                    example: '+49123456789'
                legal_address:
                  allOf:
                  - type: object
                    properties:
                      address_line_1:
                        description: First line of the address. This is usually a street name and house number combination.
                        type: string
                        maxLength: 100
                      address_line_2:
                        description: Second address line for any required additions to the first line. A typical example is c/o information.
                        type: string
                        maxLength: 100
                      postal_code:
                        description: Postal code of the address.
                        type: string
                        maxLength: 20
                      city:
                        description: City of the address.
                        type: string
                        maxLength: 100
                      state:
                        description: State of the address (if applicable).
                        type: string
                        maxLength: 100
                      country:
                        description: Country code (ISO 3166-1 alpha-3, e.g. `DEU`, `USA`).
                        type: string
                        example: DEU
                        enum:
                        - ABW
                        - AFG
                        - AGO
                        - AIA
