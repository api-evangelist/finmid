  aid: finmid:finmid-b2b-payments-api-2
- name: finmid Capital API
  description: >-
    Offer pre-approved, customizable financing to businesses on a platform: real-time offer generation,
    an embeddable acceptance widget (iframe), business onboarding and KYB, fundings, and business payments.
    JSON over HTTPS, X-API-Key auth, HMAC-signed webhooks, and RFC 9421 HTTP Message Signatures for platform-provided
    capital payouts.
