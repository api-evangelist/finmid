aid: finmid

name: Finmid

description: 'finmid is a Berlin-based embedded lending and B2B payments infrastructure provider that lets software platforms and marketplaces
  offer financing — cash advances, term loans, and business loans — to their customers across 30+ European markets without becoming a lender or
  handling the regulatory complexity themselves. finmid exposes two REST APIs: the B2B Payments API (buyer/seller onboarding, payment requests,
  payouts, and repayment) and the Capital API (pre-approved offer generation, an embeddable acceptance widget, business onboarding/KYB, fundings,
  and payments). Both APIs are JSON over HTTPS, authenticated with an environment-scoped X-API-Key header, with a separate sandbox environment,
  HMAC-signed webhooks for asynchronous events, and HTTP Message Signatures (RFC 9421, Ed25519) for platform-provided capital payout execution.'

