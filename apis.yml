apis:
- name: finmid B2B Payments API
  description: >-
    Embed B2B payment and financing into a platform: onboard buyers and
    sellers, create payment requests financed by a finmid loan, create payouts,
    upload documents, and track repayment. JSON over HTTPS, X-API-Key auth,
    with a sandbox environment and simulation endpoints.
  humanURL: https://docs.finmid.com/reference/api-introduction
  baseURL: https://api.finmid.com
  tags:
  - B2B Payments
  - Embedded Lending
  - Payments
  properties:
  - type: Documentation
    url: https://docs.finmid.com/docs/b2b-payments-core-concepts
  - type: Webhooks
    url: https://docs.finmid.com/docs/webhooks
- name: finmid Capital API
  description: >-
    Offer pre-approved, customizable financing to businesses on a platform:
    real-time offer generation, an embeddable acceptance widget (iframe),
    business onboarding and KYB, fundings, and business payments. JSON over
    HTTPS, X-API-Key auth, HMAC-signed webhooks, and RFC 9421 HTTP Message
    Signatures for platform-provided capital payouts.
  humanURL: https://docs.finmid.com/docs/capital-core-concepts
  baseURL: https://api.finmid.com
