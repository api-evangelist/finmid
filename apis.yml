apis:
- name: finmid B2B Payments API
  description: >-
    Embed B2B payment and financing into a platform: onboard buyers and sellers, create payment requests
    financed by a finmid loan, create payouts, upload documents, and track repayment. JSON over HTTPS,
    X-API-Key auth, with a sandbox environment and simulation endpoints.
  humanURL: https://docs.finmid.com/reference/api-introduction
  baseURL: https://api.finmid.com
  tags:
  - B2B Payments
  - Embedded Lending
  - Payments
